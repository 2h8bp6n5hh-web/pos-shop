<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ร้านค้า POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ร้านค้า POS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--p:#111827;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--bg:#f4f6f8;--card:#fff;--line:#e5e7eb;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:1050px;margin:auto;padding:12px 12px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-size:23px;font-weight:850}.sub{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:5px 0;z-index:5}
.tab{border:0;border-radius:11px;padding:10px 4px;background:#e5e7eb;color:#374151;font-weight:700}.tab.active{background:var(--p);color:white}
.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 3px 14px #00000008;margin-bottom:12px}
h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
input,select{width:100%;padding:11px;border:1px solid #d7dbe0;border-radius:10px;background:white;font-size:15px;outline:none}
input:focus,select:focus{border-color:#9ca3af}
button{font-family:inherit;cursor:pointer}.btn{border:0;border-radius:11px;padding:11px 13px;background:var(--p);color:#fff;font-weight:750}.green{background:var(--green)}.red{background:#fee2e2;color:var(--red)}.blue{background:#eff6ff;color:#1d4ed8}.ghost{background:white;color:#374151;border:1px solid var(--line)}
.items{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);border-radius:13px;padding:9px}
.fields{display:grid;grid-template-columns:1fr 90px 70px 40px;gap:6px}.remove{border:0;border-radius:9px;background:#fee2e2;color:#dc2626;font-size:20px}
.add{width:100%;margin-top:9px;background:#eef2ff;color:#3730a3;border:0;border-radius:11px;padding:12px;font-weight:750}
.line{display:flex;justify-content:space-between;margin:8px 0;color:#4b5563}.total{font-size:25px;font-weight:850;color:#111827;border-top:1px solid var(--line);padding-top:11px}
.pay{background:#f3f4f6;border-radius:13px;padding:12px;margin-top:13px}.change{font-size:24px;font-weight:850;color:var(--green);margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.search{margin-bottom:9px}.product{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:11px;margin:6px 0}.product small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;font-size:21px;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:25px 5px}.dangerText{color:var(--red)}.stockLow{color:#d97706;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:white;width:min(650px,100%);border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.sheetTop{display:flex;justify-content:space-between;align-items:center}
@media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.fields{grid-template-columns:1fr 78px 65px 38px}.app{padding-bottom:30px}.tab{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<div class="top">
 <div><div class="brand" id="shopTitle">🧾 ร้านค้า POS</div><div class="sub" id="dateNow"></div></div>
 <button class="btn ghost" id="settingsBtn">⚙️ ร้าน</button>
</div>

<div class="tabs">
 <button class="tab active" data-page="sale">🧾 ขาย</button>
 <button class="tab" data-page="stock">📦 สต็อก</button>
 <button class="tab" data-page="history">📋 ประวัติ</button>
 <button class="tab" data-page="dashboard">📊 รายวัน</button>
</div>

<section id="sale" class="page active">
<div class="grid">
<div class="card">
<h2>รายการสินค้า</h2>
<div id="cart" class="items"></div>
<button class="add" id="addItem">＋ เพิ่มรายการ</button>
<div style="margin-top:14px">
 <div class="line"><span>ยอดรวม</span><b id="subtotal">฿0.00</b></div>
 <div class="line"><span>ส่วนลด (%)</span><input id="discount" type="number" min="0" max="100" value="0" style="width:90px;text-align:right"></div>
 <div class="line"><span>ส่วนลด</span><b id="discountAmt">฿0.00</b></div>
 <div class="line total"><span>ยอดสุทธิ</span><span id="total">฿0.00</span></div>
</div>
</div>
<div class="card">
<h2>ชำระเงิน</h2>
<div class="pay"><div class="sub">เงินที่ลูกค้าจ่าย</div><input id="paid" type="number" inputmode="decimal" min="0" placeholder="0.00" style="font-size:24px;margin-top:6px"><div class="sub" style="margin-top:11px">เงินทอน</div><div id="change" class="change">฿0.00</div></div>
<div class="actions">
<button class="btn green" id="checkout">✓ รับเงิน / บันทึกขาย</button>
<button class="btn" id="print">🖨️ ใบเสร็จ</button>
<button class="btn ghost" id="newSale">รายการใหม่</button>
<button class="btn ghost" id="round">ปัดเงิน</button>
</div>
</div>
</div>
</section>

<section id="stock" class="page">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><h2>📦 สต็อกสินค้า</h2><button class="btn blue" id="newProduct">＋ เพิ่มสินค้า</button></div>
<input id="stockSearch" class="search" placeholder="ค้นหาสินค้า...">
<div id="stockList"></div>
</div>
</section>

<section id="history" class="page">
<div class="card"><h2>📋 ประวัติการขาย</h2><input id="historyDate" type="date" class="search"><div id="historyList"></div></div>
</section>

<section id="dashboard" class="page">
<div class="stats">
<div class="stat"><span class="sub">ยอดขายวันนี้</span><b id="daySales">฿0</b></div>
<div class="stat"><span class="sub">จำนวนบิล</span><b id="dayBills">0</b></div>
<div class="stat"><span class="sub">สินค้าขาย</span><b id="dayItems">0</b></div>
</div>
<div class="card" style="margin-top:12px"><h2>📊 สรุปยอดวันนี้</h2><div id="dailyDetail"></div></div>
</section>
</div>

<div id="modal" class="modal"><div class="sheet">
<div class="sheetTop"><h2 id="modalTitle">เพิ่มสินค้า</h2><button class="btn ghost" id="closeModal">ปิด</button></div>
<div style="display:grid;gap:9px">
<label>ชื่อสินค้า<input id="pName" placeholder="เช่น น้ำดื่ม"></label>
<label>ราคาขาย<input id="pPrice" type="number" min="0" inputmode="decimal" placeholder="0"></label>
<label>จำนวนในสต็อก<input id="pStock" type="number" min="0" inputmode="numeric" placeholder="0"></label>
<button class="btn green" id="saveProduct">บันทึกสินค้า</button>
</div>
</div></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const money=n=>"฿"+Number(n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
let products=JSON.parse(localStorage.getItem("pos_products")||"[]");
let sales=JSON.parse(localStorage.getItem("pos_sales")||"[]");
let shop=localStorage.getItem("pos_shop")||"ร้านค้า POS";
let editId=null;

$("shopTitle").textContent="🧾 "+shop;
$("dateNow").textContent=new Date().toLocaleDateString("th-TH",{dateStyle:"full"});
$("historyDate").value=today();

function save(){localStorage.setItem("pos_products",JSON.stringify(products));localStorage.setItem("pos_sales",JSON.stringify(sales));}
function addCart(name="",price="",qty=1,id=""){
 const row=document.createElement("div");row.className="item";row.dataset.pid=id;
 row.innerHTML='<div class="fields"><input class="name" placeholder="ชื่อสินค้า" value="'+esc(name)+'"><input class="price" type="number" min="0" inputmode="decimal" placeholder="ราคา" value="'+price+'"><input class="qty" type="number" min="1" inputmode="numeric" value="'+qty+'"><button type="button" class="remove">×</button></div>';
 $("cart").appendChild(row);
 row.querySelectorAll("input").forEach(x=>x.addEventListener("input",calc));
 row.querySelector(".remove").onclick=()=>{row.remove();calc()};
 calc();
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function calc(){
 let sub=0;
 document.querySelectorAll("#cart .item").forEach(r=>sub+=(Number(r.querySelector(".price").value)||0)*Math.max(1,Number(r.querySelector(".qty").value)||1));
 const d=Math.min(100,Math.max(0,Number($("discount").value)||0)),da=sub*d/100,total=sub-da,paid=Number($("paid").value)||0;
 $("subtotal").textContent=money(sub);$("discountAmt").textContent=money(da);$("total").textContent=money(total);$("change").textContent=money(Math.max(0,paid-total));
}
function resetCart(){ $("cart").innerHTML="";$("discount").value=0;$("paid").value="";addCart(); }
function checkout(){
 const rows=[...document.querySelectorAll("#cart .item")].map(r=>({name:r.querySelector(".name").value||"สินค้า",price:Number(r.querySelector(".price").value)||0,qty:Math.max(1,Number(r.querySelector(".qty").value)||1),pid:r.dataset.pid||""})).filter(x=>x.price>0);
 if(!rows.length){alert("กรุณาเพิ่มสินค้าและใส่ราคา");return}
 const total=Number($("total").textContent.replace(/[฿,]/g,""))||0,paid=Number($("paid").value)||0;
 if(paid<total){alert("เงินที่รับยังไม่พอ ยอดสุทธิ "+money(total));return}
 rows.forEach(x=>{if(x.pid){let p=products.find(p=>p.id===x.pid);if(p)p.stock=Math.max(0,p.stock-x.qty)}});
 sales.unshift({id:Date.now(),date:today(),time:new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}),items:rows,total,paid,change:paid-total});
 save();alert("บันทึกการขายแล้ว ✓\nยอด "+money(total)+"\nเงินทอน "+money(paid-total));resetCart();renderAll();
}
function renderStock(){
 const q=$("stockSearch").value.toLowerCase();let arr=products.filter(p=>p.name.toLowerCase().includes(q));
 if(!arr.length){$("stockList").innerHTML='<div class="empty">ยังไม่มีสินค้า<br>กด “＋ เพิ่มสินค้า” เพื่อเริ่มต้น</div>';return}
 $("stockList").innerHTML=arr.map(p=>'<div class="product"><div><b>'+esc(p.name)+'</b><br><small>'+money(p.price)+' · สต็อก <span class="'+(p.stock<=3?"stockLow":"")+'">'+p.stock+'</span></small></div><div style="display:flex;gap:5px"><button class="btn ghost edit" data-id="'+p.id+'">แก้ไข</button><button class="btn red del" data-id="'+p.id+'">ลบ</button></div></div>').join("");
 document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>openProduct(b.dataset.id));
 document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(confirm("ลบสินค้านี้?")){products=products.filter(p=>p.id!==b.dataset.id);save();renderStock()}});
}
function openProduct(id=null){editId=id;$("modalTitle").textContent=id?"แก้ไขสินค้า":"เพิ่มสินค้า";let p=products.find(x=>x.id===id);$("pName").value=p?.name||"";$("pPrice").value=p?.price??"";$("pStock").value=p?.stock??"";$("modal").classList.add("show")}
function saveProduct(){let name=$("pName").value.trim(),price=Number($("pPrice").value)||0,stock=Math.max(0,Number($("pStock").value)||0);if(!name){alert("กรุณาใส่ชื่อสินค้า");return}if(editId){let p=products.find(x=>x.id===editId);p.name=name;p.price=price;p.stock=stock}else products.push({id:String(Date.now()),name,price,stock});save();$("modal").classList.remove("show");renderStock()}
function renderHistory(){
 let d=$("historyDate").value||today(),arr=sales.filter(s=>s.date===d);
 if(!arr.length){$("historyList").innerHTML='<div class="empty">ไม่มีรายการขายในวันนี้</div>';return}
 $("historyList").innerHTML='<table><thead><tr><th>เวลา</th><th>รายการ</th><th>ยอด</th></tr></thead><tbody>'+arr.map(s=>'<tr><td>'+s.time+'</td><td>'+s.items.map(i=>esc(i.name)+' ×'+i.qty).join(", ")+'</td><td><b>'+money(s.total)+'</b></td></tr>').join("")+'</tbody></table>';
}
function renderDashboard(){
 let arr=sales.filter(s=>s.date===today()),total=arr.reduce((a,s)=>a+s.total,0),items=arr.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0);
 $("daySales").textContent=money(total);$("dayBills").textContent=arr.length;$("dayItems").textContent=items;
 let map={};arr.forEach(s=>s.items.forEach(i=>map[i.name]=(map[i.name]||0)+i.qty));
 let list=Object.entries(map).sort((a,b)=>b[1]-a[1]);
 $("dailyDetail").innerHTML=list.length?'<table><thead><tr><th>สินค้า</th><th>จำนวนขาย</th></tr></thead><tbody>'+list.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+x[1]+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">วันนี้ยังไม่มีการขาย</div>';
}
function renderAll(){renderStock();renderHistory();renderDashboard();calc()}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(t.dataset.page).classList.add("active");renderAll()});
$("addItem").onclick=()=>addCart();
$("discount").oninput=calc;$("paid").oninput=calc;$("checkout").onclick=checkout;$("newSale").onclick=resetCart;
$("round").onclick=()=>{let t=Number($("total").textContent.replace(/[฿,]/g,""))||0;$("paid").value=Math.ceil(t/10)*10;calc()};
$("print").onclick=()=>{let w=window.open("","_blank");if(!w){alert("Safari บล็อก Pop-up กรุณาอนุญาต Pop-up");return}let txt=shop+"\n----------------------\n";document.querySelectorAll("#cart .item").forEach(r=>txt+=(r.querySelector(".name").value||"สินค้า")+" x"+(r.querySelector(".qty").value||1)+"  "+money((Number(r.querySelector(".price").value)||0)*(Number(r.querySelector(".qty").value)||1))+"\n");txt+="----------------------\nยอดสุทธิ "+$("total").textContent;w.document.write("<pre style='font:16px monospace;white-space:pre-wrap'>"+txt+"</pre>");w.document.close();w.print()};
$("newProduct").onclick=()=>openProduct();$("saveProduct").onclick=saveProduct;$("closeModal").onclick=()=>$("modal").classList.remove("show");$("stockSearch").oninput=renderStock;$("historyDate").onchange=renderHistory;
$("settingsBtn").onclick=()=>{let n=prompt("ชื่อร้าน",shop);if(n&&n.trim()){shop=n.trim();localStorage.setItem("pos_shop",shop);$("shopTitle").textContent="🧾 "+shop}};
addCart();renderAll();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function(e) {
      console.log("Service Worker registration failed:", e);
    });
  });
}
</script>
</body>
</html>
